name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci 
      - run: npm test 
  
  docker:
    needs: test
    runs-on: ubuntu-latest 
    steps:
      - usess: actions/checkout@v4 
      - name: Build image
        run: docker build -t learning-app:${{github.sha}} .
      - name: Start container
        run: docker run -d --name smoke -p 3000:3000 learning-app:${{github.sha}} 
      - name: Smoke test
        run: |
        sleep 3
        curl --fail http://localhost:3000/health