name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci 
      - run: npm test 
  
  docker:
    needs: test
    runs-on: ubuntu-latest 
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/mukulbhardwaj-24/learning-app
    steps:
      - uses: actions/checkout@v5 
      - name: Build image
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t learning-app:${{github.sha}} .
      - name: Start container
        run: docker run -d --name smoke -p 3000:3000 learning-app:${{github.sha}} 
      - name: Smoke test
        run: |
          sleep 3
          curl --fail http://localhost:3000/health
      - name: Show contianer logs on failure
        if: failure()
        run: docker logs smoke

      - name: Log in to GHCR
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker tag learning-app:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker tag learning-app:${{ github.sha }} $IMAGE:latest 
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

    deploy:
      needs: docker
      if: github.event_name == 'push'
      runs-on: ubuntu-latest
      env:
        APP_URL: https://learning-app-h61f.onrender.com
      steps:
        - name: Trigger Render deploy of this exact image
          run: |
            curl --fail -s -X POST \
              "${{ secrets.RENDER_DEPLOY_HOOK }}&imgURL=ghcr.io%2Fmukulbhardwaj-24%2Flearning-app%3A${{ github.sha }}" \
              > /dev/null
            echo "Deploy requested for ${{ github.sha }}"

        - name: Wait until the new version is live
          run: |
            for i in $(seq 1 30); do
              live=$(curl -s "$APP_URL/api/info" | grep -o '"version":"[^"]*"' || true)
              echo "attempt $i: $live"
              if echo "$live" | grep -q "${{ github.sha }}"; then
                echo "✅ ${{ github.sha }} is live"
                exit 0
              fi
              sleep 10
            done
            echo "❌ new version did not go live within 5 minutes"
            exit 1